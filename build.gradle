buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://maven.brott.dev/' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.8.0"
    }
}

subprojects {
    buildscript {
        repositories { google(); mavenCentral(); maven { url 'https://maven.brott.dev/' } }
        dependencies { classpath "com.android.tools.build:gradle:8.8.0" }
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
                details.because 'Keep kotlin-stdlib / jdk7 / jdk8 in sync'
            }
        }
        resolutionStrategy.force(
                'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        )
    }
}

tasks.register("cleanAll", Delete) {
    delete rootProject.buildDir
}
